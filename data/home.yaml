sections: [hero, timeline, cards, faq, cta]

hero:
  align: center
  eyebrow: hello world
  title_lines:
    - words: [{ text: Hello, world. }]
  lead: A blank field manual — duplicate it and fill in your own field procedures.
  actions:
    - { label: Open the manual, url: hello-world/, icon: fa-solid fa-seedling, style: primary }

cards:
  eyebrow: Manual
  title: Inside this manual
  columns: 2
  items:
    - title: Prerequisites
      desc: What must be true before you start.
      icon: fa-solid fa-list-check
      url: hello-world/prerequisites/
    - title: Set up
      desc: One procedure that changes the system — procedure, verification, rollback.
      icon: fa-solid fa-play
      url: hello-world/set-up/
    - title: Operate
      desc: Day-two health checks, drift detection, and when to escalate.
      icon: fa-solid fa-gauge-high
      url: hello-world/operate/
    - title: Things that broke
      desc: Known issues where you hit them — symptom, diagnosis, workaround, tracker id.
      icon: fa-solid fa-triangle-exclamation
      url: hello-world/things-that-broke/
    - title: Customize this!
      desc: Set the choices this manual remembers — version, ops mode, name, cluster.
      icon: fa-solid fa-sliders
      url: hello-world/customize/
    - title: Teardown
      desc: Remove what you created — clean-up, verification, and what to leave behind.
      icon: fa-solid fa-broom
      url: hello-world/teardown/

cta:
  title: We want your feedback.
  text: Report issues here
  label: Github Issues
  url: https://github.com/rh-aiservices-bu/CAI-Field-Manual-Hello-World/issues
  style: primary

timeline:
  eyebrow: The format
  title: Every manual walks the field-work timeline
  items:
    - date: Phase 1
      icon: fa-solid fa-list-check
      title: Prerequisites
      desc: What must be true before following the manual.
    - date: Phase 2
      icon: fa-solid fa-play
      title: Set up
      desc: One procedure that changes the system — prerequisites, status-gated commands, verification, rollback.
    - date: Phase 3
      icon: fa-solid fa-gauge-high
      title: Operate
      desc: Day-two health checks, drift detection, and when to escalate.
    - date: Phase 4
      icon: fa-solid fa-triangle-exclamation
      title: Things that broke
      desc: Known issues where you hit them — symptom, diagnosis, workaround, tracker id.
    - date: Phase 5
      icon: fa-solid fa-broom
      title: Teardown
      desc: Remove what you created and verify the system is clean.

faq:
  eyebrow: For readers
  title: Questions people actually ask
  items:
    - question: Why does every command show its expected output?
      answer: A command whose output nobody checks is a guess about the system's state. The status gate turns "ran it" into "confirmed it".
    - question: Why do versions and ops modes live in a selector instead of separate pages?
      answer: Divergence is permanent; separate pages fork the manual and drift apart. The selector filters, the choice persists, and the markdown output carries every variant labeled for agents.
