sections: [hero, cards, faq, cta]

hero:
  align: center
  eyebrow: hello world
  title_lines:
    - words: [{ text: "Hello, world!", style: primary }]
  lead: A blank field manual to copy and make your own.
  actions:
    - { label: Open the Hello World of Field Manuals, url: hello-world/, icon: fa-solid fa-seedling, style: primary }

cards:
  eyebrow: Manual
  title: Inside this manual
  columns: 2
  text: Three chapters are live; the other four are template stubs you create by following Writing the field manual.
  items:
    - title: Introduction
      desc: The format, who writes it, and the contract it makes.
      icon: fa-solid fa-book-open
      url: hello-world/what-is-a-field-manual/
    - title: Editing
      desc: Install the toolchain, clone, preview, and publish.
      icon: fa-solid fa-pen-to-square
      url: hello-world/editing/
    - title: Set up
      desc: One procedure that changes the system, with rollback.
      icon: fa-solid fa-play
      url: ""
    - title: Operate
      desc: Day-two health checks and drift detection.
      icon: fa-solid fa-gauge-high
      url: ""
    - title: Things that broke
      desc: Known issues and their workarounds, documented inline.
      icon: fa-solid fa-triangle-exclamation
      url: ""
    - title: Customize this!
      desc: Pick your version, ops mode, name, and cluster once.
      icon: fa-solid fa-sliders
      url: hello-world/customize/
    - title: Teardown
      desc: Remove everything, and verify the system is clean.
      icon: fa-solid fa-broom
      url: ""

cta:
  title: We want your feedback.
  text: Report issues here
  label: Github Issues
  url: https://github.com/rh-aiservices-bu/CAI-Field-Manual-Hello-World/issues
  style: primary

