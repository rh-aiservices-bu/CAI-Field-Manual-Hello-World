faq:
  eyebrow: For readers
  title: Questions people actually ask
  items:
    - question: Why does every command show its expected output?
      answer: Because a step is done when its verify output matches, not when the command runs.
    - question: Why do versions and ops modes live in a selector instead of separate pages?
      answer: Separate pages fork the manual and drift apart; the selector keeps one page that filters.
