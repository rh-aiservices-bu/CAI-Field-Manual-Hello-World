# CAI Field Manual — Hello World site. Content repo: owns all content
# (landing, doctrine, manuals) and imports the chrome/rules module
# CAI-Field-Manual-Shell (layouts, assets, static, scripts).
title: CAI Field Manual
baseURL: https://rh-aiservices-bu.github.io/CAI-Field-Manual-Hello-World/
defaultContentLanguage: en
disableLanguages: [zh, fr]
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: UTC

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: CAI Field Manual
    params:
      description: Documentation, updates, and manuals for your project.
  # Keep disabled languages declared so Hugo recognizes .zh.md and .fr.md as
  # translations instead of treating them as duplicate English pages.
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: CAI Field Manual
    hasCJKLanguage: true
  fr:
    label: Français
    locale: fr-FR
    weight: 3
    title: CAI Field Manual

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

services:
  googleAnalytics:
    ID: G-7ZXCS2MF1D

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  # LLMSFULL is enabled per section in front matter: the theme emits it only
  # for a top-level section and warns for nested ones, so a site-wide section
  # output trips /field-manual/hello-world/. content/field-manual/_index.md
  # opts in; the chat page reads that bundle as its whole-manual context.
  section: [HTML, RSS, print, markdown]

params:
  github_repo: https://github.com/rh-aiservices-bu/CAI-Field-Manual-Hello-World
  github_branch: main
  offline_search: true
  copyright:
    authors: Project contributors
    from_year: 2026
  footer_center_info: ''
  # the shell module) persists these in localStorage and filters content
  # blocks tagged with the variant shortcode. These live HERE, not in the
  # shell module, so scripts/check-contracts.sh can validate content against
  # the config at this site's root. Ordered slice: render order in the
  # selector and the Customize form. Every axis needs `neutral` (the
  # show-all option id, never hides and never hidden) and a `default` that
  # is one of its option ids. Block ids may list several options:
  # {{< variant version "3.5 3.6" >}}.
  variants:
    - id: version
      label: RHAIE Version
      default: '3.6'
      neutral: all
      status:
        specific: 'RHAIE {value}'
        neutral: all versions
      options:
        - { id: all, label: Show all }
        - { id: '3.4', label: '3.4' }
        - { id: '3.5', label: '3.5' }
        - { id: '3.6', label: '3.6' }
    - id: mode
      label: Ops Mode
      default: all
      neutral: all
      status:
        specific: '{value} steps'
        neutral: every ops mode
      options:
        - { id: all, label: Show all }
        - { id: gitops, label: GitOps }
        - { id: manual, label: Manual }
        - { id: scripted, label: Scripted }
  # Customize fields: text values the reader sets once on the "Customize
  # this!" page and that substitute into every `customize` shortcode token
  # across the manuals. Defaults are the shipped examples, not real values.
  customize:
    - { id: user, label: Your name, default: guest }
    - { id: cluster, label: Cluster, default: .ocp.abcd.sandbox1234.opentlc.com }

# Site header navigation. oink renders .Site.Menus.main in the navbar center
# zone and the home mobile drawer; the entry's page supplies the icon, and
# llms.txt lists it under Site index. Field Manual stays reachable through
# the landing cards and the sidebar, so Chat is the only entry for now.
menus:
  main:
    - identifier: chat
      name: Chat
      pageRef: /chat
      weight: 30

module:
  imports:
    - path: github.com/rh-aiservices-bu/CAI-Field-Manual-Shell
  hugoVersion:
    extended: true
    min: 0.168.0
