{{ $isFlow := eq (.Get "file") "visualizers/fm-flow.html" -}}
{{ if and $isFlow (eq (.Get "embed") "true") -}}
<style>
.td-shell-article:has(.td-viz-embed--flow) { overflow: visible; }
.td-viz-embed--flow:not(.td-viz-embed--expanded) {
  width: min(980px, calc(100vw - 340px));
  max-width: none;
  margin-left: calc(50% - min(490px, calc(50vw - 170px)));
  aspect-ratio: auto;
  min-height: 640px;
  border: 0;
  box-shadow: 0 1px 0 var(--bs-border-color);
}
</style>
{{ end -}}
{{ if eq (.Get "embed") "true" }}
<div class="td-viz-embed{{ if $isFlow }} td-viz-embed--flow{{ end }}" id="td-viz-embed-{{ .Ordinal }}">
  <button type="button" class="td-viz-embed__expand" aria-label="Expand the visualizer" title="Expand"></button>
  <iframe src="{{ .Get "file" | relURL }}" title="{{ .Get "label" }}" loading="lazy"></iframe>
  <a class="td-viz-embed__fallback" href="{{ .Get "file" | relURL }}" target="_blank" rel="noopener">Open the {{ .Get "label" }} in a new tab</a>
</div>
<script>
(function () {
  var embed = document.getElementById('td-viz-embed-{{ .Ordinal }}');
  if (!embed) return;
  var btn = embed.querySelector('.td-viz-embed__expand');
  btn.addEventListener('click', function () {
    var open = embed.classList.toggle('td-viz-embed--expanded');
    document.documentElement.classList.toggle('td-viz-lock', open);
    btn.setAttribute('aria-label', open ? 'Collapse the visualizer' : 'Expand the visualizer');
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && embed.classList.contains('td-viz-embed--expanded')) btn.click();
  });
})();
</script>
{{ else }}
<a href="{{ .Get "file" | relURL }}" target="_blank" rel="noopener">{{ .Get "label" }}</a>
{{ end -}}
